# MTU2 part B scenario (ruster-scenario/v1): DF-clear datagrams above the
# 576-byte WAN MTU are fragmented after the NAT (RFC 791 §3.2, RFC 1812
# §4.2.2.7), through the validated config (`[fragmentation]`), the
# publication, and run_tick on SimIo (the generated fragment phase).
#
# Hosts as in fixtures/mtu2a: LAN host H 192.168.1.10, WAN gateway G
# 203.0.113.1, server S 198.51.100.20; router LAN 192.168.1.1 (MTU 1500),
# WAN and NAT public address 203.0.113.2 (MTU 576). `[fragmentation]`
# allows 2 fragments per datagram and 1 datagram per tick.
#
# The fragments are pinned as raw frames. Their generated NAT ID was read
# from the run (as in fixtures/mtu2a); crates/sim-scenario/tests/
# fragmentation.rs rebuilds every fragment independently from RFC 791 and
# the translated datagram and checks the pinned bytes, so the pinned frames
# do not rest on router output alone.
schema = "ruster-scenario/v1"
seed = 20261105
config = "router.toml"

# --- 1. Resolve G (H's first datagram, with DF, waits for ARP).
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 1 }, src-port = 5000, dst-port = 53, payload-ascii = "query-1" }

[[step]]
kind = "tick"
at-ms = 0

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "tick"
at-ms = 10

[[step]]
kind = "expect"
generation = 1
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
]

# --- 2. A 1000-byte DF-clear UDP datagram (host ID 100) leaves as two
# fragments (552 + 428 data bytes) with one generated ID of
# (203.0.113.2, 198.51.100.20, UDP); the received frame is consumed.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 100, df = false }, src-port = 5000, dst-port = 53, payload-hex = "" }

[[step]]
kind = "tick"
at-ms = 20

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "raw", hex = "" } },
  { interface = "wan", frame = { kind = "raw", hex = "" } },
]
consumes = [
  { reason = "IPV4_FRAGMENTED", count = 1 },
]

# --- 3. A 900-byte DF-clear Echo Request (Windows ping) leaves as two
# fragments through the ICMP query NAT.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 500, df = false }, op = "request", id = 40007, seq = 1, payload-hex = "" }

[[step]]
kind = "tick"
at-ms = 30

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "raw", hex = "" } },
  { interface = "wan", frame = { kind = "raw", hex = "" } },
]
consumes = [
  { reason = "IPV4_FRAGMENTED", count = 2 },
]

# --- 4. A 1500-byte DF-clear datagram would need 3 fragments, above
# `max-fragments-per-datagram = 2`: dropped whole before its mapping
# (source port 5002) commits.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 101, df = false }, src-port = 5002, dst-port = 53, payload-hex = "" }

[[step]]
kind = "tick"
at-ms = 40

[[step]]
kind = "expect"
tx = []
drops = [
  { reason = "IPV4_FRAGMENTATION_TOO_MANY_FRAGMENTS", count = 1 },
]

# --- 5. Two 1000-byte DF-clear datagrams in one tick: the first takes the
# only slot and leaves as fragments, the second (source port 5003) is
# IPV4_FRAGMENTATION_QUEUE_FULL before its mapping commits.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 102, df = false }, src-port = 5000, dst-port = 53, payload-hex = "" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 103, df = false }, src-port = 5003, dst-port = 53, payload-hex = "" }

[[step]]
kind = "tick"
at-ms = 50

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "raw", hex = "" } },
  { interface = "wan", frame = { kind = "raw", hex = "" } },
]
drops = [
  { reason = "IPV4_FRAGMENTATION_QUEUE_FULL", count = 1 },
]
consumes = [
  { reason = "IPV4_FRAGMENTED", count = 3 },
]
