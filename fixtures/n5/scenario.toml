# N5 scenario (ruster-scenario/v1): ICMP query NAT (RFC 5508 §3) driven
# through the validated config, the publication, and run_tick on SimIo.
#
# Same hosts as fixtures/m1: LAN host H 192.168.1.10, WAN gateway G
# 203.0.113.1 (resolved by ARP), server S 198.51.100.20 behind G. Router WAN
# 203.0.113.2 is also the NAT public address. H uses Echo identifier 40007,
# which is in the identifier pool (the realm ports) and free, so it is
# preserved (identifier-preservation = true).
schema = "ruster-scenario/v1"
seed = 20261102
config = "router.toml"

# --- 1. Resolve G (as in the M1 scenario).
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 1 }, src-port = 5000, dst-port = 53, payload-ascii = "query-1" }

[[step]]
kind = "tick"
at-ms = 0

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "tick"
at-ms = 10

[[step]]
kind = "expect"
generation = 1
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
]

# --- 2. H pings S: the request leaves from the public address with the
# preserved identifier (REQ-1, REQ-1 a) and the reply returns to H. The
# builder computes every checksum from scratch, so the expectation checks
# the router's incremental updates.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 11 }, op = "request", id = 40007, seq = 1, payload-ascii = "ping-1" }

[[step]]
kind = "tick"
at-ms = 20

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 12 }, op = "reply", id = 40007, seq = 1, payload-ascii = "ping-1" }

[[step]]
kind = "tick"
at-ms = 30

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 11, ttl = 63 }, op = "request", id = 40007, seq = 1, payload-ascii = "ping-1" } },
  { interface = "lan", frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 12, ttl = 63 }, op = "reply", id = 40007, seq = 1, payload-ascii = "ping-1" } },
]

# --- 3. An unsolicited reply (no mapping) and a reply from another remote
# (address-dependent filtering) are dropped; S pinging the public address is
# answered by the router itself (the Echo responder, IPv4 ID 0, TTL 64).
[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 13 }, op = "reply", id = 40008, seq = 1 }

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.21", dst = "203.0.113.2", id = 14 }, op = "reply", id = 40007, seq = 2 }

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 15 }, op = "request", id = 9, seq = 1, payload-ascii = "hi" }

[[step]]
kind = "tick"
at-ms = 40

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 0, ttl = 64 }, op = "reply", id = 9, seq = 1, payload-ascii = "hi" } },
]
drops = [{ reason = "NEIGHBOR_UNRESOLVED", count = 1 }, { reason = "NAT44_ICMP_MAPPING_MISS", count = 1 }, { reason = "NAT44_ICMP_FILTER_DENIED", count = 1 }]

# --- 4. H pinging the public address is answered by the router on the LAN
# (the router owns the public address; a NAPT has no inbound query session to
# hairpin to).
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "203.0.113.2", id = 16 }, op = "request", id = 77, seq = 1, payload-ascii = "self" }

[[step]]
kind = "tick"
at-ms = 50

[[step]]
kind = "expect"
tx = [
  { interface = "lan", frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "203.0.113.2", dst = "192.168.1.10", id = 0, ttl = 64 }, op = "reply", id = 77, seq = 1, payload-ascii = "self" } },
]

# --- 5. Endpoint-independent filtering is a reloadable change (the apply
# flushes the query mapping and its peer); removing [nat44.icmp] changes the
# storage shape and is refused as restart-required.
[[step]]
kind = "apply"
config = "router-eif.toml"
outcome = "applied"

[[step]]
kind = "apply"
config = "router-off.toml"
outcome = "rejected"
reason = "restart-required"

[[step]]
kind = "expect"
generation = 2
tx = []

# --- 6. The reload also flushed ARP learning, so G is resolved again.
# Then a new query maps again, and a reply from another remote is admitted
# by the NAT (endpoint-independent) but the firewall still requires its own
# flow, so it is dropped there.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 20 }, op = "request", id = 40007, seq = 2 }

[[step]]
kind = "tick"
at-ms = 3390

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 21 }, op = "request", id = 40007, seq = 3 }

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.21", dst = "203.0.113.2", id = 22 }, op = "reply", id = 40007, seq = 3 }

[[step]]
kind = "tick"
at-ms = 3400

[[step]]
kind = "expect"
generation = 2
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
  { interface = "wan", frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 21, ttl = 63 }, op = "request", id = 40007, seq = 3 } },
]
drops = [{ reason = "NEIGHBOR_UNRESOLVED", count = 2 }, { reason = "FIREWALL_DEFAULT_DENIED", count = 1 }]
