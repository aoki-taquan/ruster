# B3 scenario (ruster-scenario/v1): RFC 5382 REQ-4 delayed ICMP Port
# Unreachable for unsolicited inbound TCP SYNs, driven through the public
# full-service composition (run_tick + ActivePublication) on SimIo.
#
# Same hosts as fixtures/m1: LAN host H 192.168.1.10, WAN gateway G
# 203.0.113.1 (resolved by ARP), server S 198.51.100.20 behind G. Router WAN
# 203.0.113.2 is also the NAT public address.
#
# The expected ICMP payload was computed separately from the injected SYN
# (RFC 792: type 3, code 3, checksum, unused, then the received IPv4 header
# and TCP header as quoted bytes).
schema = "ruster-scenario/v1"
seed = 20261102
config = "router.toml"

# --- 1. Resolve G (as in the M1 scenario).
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 1 }, src-port = 5000, dst-port = 53, payload-ascii = "query-1" }

[[step]]
kind = "tick"
at-ms = 0

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "tick"
at-ms = 10

[[step]]
kind = "expect"
generation = 1
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
]

# --- 2. Unsolicited SYN from S to a public port without a mapping: dropped
# silently now, still nothing 1 ms before the hold ends (6 s plus the 2 ms
# clock margin, NAT44_TCP_UNSOLICITED_SYN_CLOCK_MARGIN_MS), then exactly one
# ICMP Port Unreachable quoting the SYN.
[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 21 }, src-port = 5555, dst-port = 40003, seq = 777, flags = ["syn"], window = 8192 }

[[step]]
kind = "tick"
at-ms = 20

[[step]]
kind = "tick"
at-ms = 6021

[[step]]
kind = "expect"
tx = []
drops = [{ reason = "NEIGHBOR_UNRESOLVED", count = 1 }, { reason = "NAT44_TCP_MAPPING_MISS", count = 1 }]

[[step]]
kind = "tick"
at-ms = 6022

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", tos = 192, ttl = 64 }, protocol = 1, payload-hex = "03036362 00000000 45000028001540004006d470c6336414cb007102 15b39c4300000309000000005002200074980000" } },
]


[[step]]
kind = "tick"
at-ms = 6100

[[step]]
kind = "expect"
tx = []

# --- 3. Simultaneous open (REQ-4 MUST): S's SYN to the public port that
# H's outbound SYN will use is held; H's SYN to S is translated 1 ms before
# the hold ends, so the held SYN is dropped silently for good and S's
# retransmission opens the connection. 40007 is the deterministic keyed
# allocator choice for H:5001 under this scenario seed (N2, NAT44-020).
[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 31 }, src-port = 6666, dst-port = 40007, seq = 5000, flags = ["syn"], window = 8192 }

[[step]]
kind = "tick"
at-ms = 7000

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 32 }, src-port = 5001, dst-port = 6666, seq = 1000, flags = ["syn"], window = 4096 }

[[step]]
kind = "tick"
at-ms = 13001

[[step]]
kind = "tick"
at-ms = 13002

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 33 }, src-port = 6666, dst-port = 40007, seq = 5000, flags = ["syn"], window = 8192 }

[[step]]
kind = "tick"
at-ms = 13010

[[step]]
kind = "tick"
at-ms = 20000

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 32, ttl = 63 }, src-port = 40007, dst-port = 6666, seq = 1000, flags = ["syn"], window = 4096 } },
  { interface = "lan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 33, ttl = 63 }, src-port = 6666, dst-port = 5001, seq = 5000, flags = ["syn"], window = 8192 } },
]
drops = [{ reason = "NEIGHBOR_UNRESOLVED", count = 1 }, { reason = "NAT44_TCP_MAPPING_MISS", count = 2 }]

# --- 4. With unsolicited-syn-icmp = false (reloadable) the SYN is only
# dropped silently (REQ-4 a), even with G resolved again.
[[step]]
kind = "apply"
config = "router-off.toml"
outcome = "applied"

[[step]]
kind = "expect"
generation = 2
tx = []

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 41 }, src-port = 5000, dst-port = 53, payload-ascii = "query-2" }

[[step]]
kind = "tick"
at-ms = 21000

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 42 }, src-port = 5555, dst-port = 40003, seq = 777, flags = ["syn"], window = 8192 }

[[step]]
kind = "tick"
at-ms = 21010

[[step]]
kind = "tick"
at-ms = 27010

[[step]]
kind = "tick"
at-ms = 40000

[[step]]
kind = "expect"
generation = 2
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
]
drops = [{ reason = "NEIGHBOR_UNRESOLVED", count = 2 }, { reason = "NAT44_TCP_MAPPING_MISS", count = 3 }]
