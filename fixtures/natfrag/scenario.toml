# NAT-FRAG scenario (ruster-scenario/v1): fragments of one IPv4 datagram
# through the stateful firewall and the NAT (RFC 4787 REQ-14), in order and
# out of order, through the validated config (`[fragment-tracking]`), the
# publication, and run_tick on SimIo.
#
# Hosts as in fixtures/mtu2a: LAN host H 192.168.1.10, WAN gateway G
# 203.0.113.1, server S 198.51.100.20; router LAN 192.168.1.1, WAN and NAT
# public address 203.0.113.2, both MTU 1500. The association timeout is
# 1000 ms.
#
# Every injected fragment is the RFC 791 cut of a datagram whose UDP, TCP,
# or ICMP checksum covers the whole datagram. The forwarded fragments are
# not pinned here: crates/sim-scenario/tests/natfrag.rs rebuilds each
# translated datagram independently (only the generated ID is read from
# the output), checks every fragment, and reassembles them.
schema = "ruster-scenario/v1"
seed = 20261106
config = "router.toml"

# --- 1. Resolve G (H's first datagram, with DF, waits for ARP).

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 1 }, src-port = 5000, dst-port = 53, payload-ascii = "query-1" }

[[step]]
kind = "tick"
at-ms = 0

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "tick"
at-ms = 10

[[step]]
kind = "expect"
generation = 1
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
]

# --- 2. In order: a 3000-byte UDP datagram from H:5000 to S:53 (ID 256)
# as H's own fragments of 1480 + 1480 + 20 data bytes. The first fragment
# gets the firewall and NAT decision on its UDP header; the later two follow
# it (PUBLIC, the same generated ID). Not consumed, nothing dropped; the
# test checks the three fragments and their reassembly.

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 256, df = false, mf = true, fragment-offset = 0, ttl = 64 }, protocol = 17, payload-hex = "" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 256, df = false, mf = true, fragment-offset = 185, ttl = 64 }, protocol = 17, payload-hex = "" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 256, df = false, mf = false, fragment-offset = 370, ttl = 64 }, protocol = 17, payload-hex = "effc091623303d4a5764717e8b98a5b2bfccd9e6" }

[[step]]
kind = "tick"
at-ms = 20

[[step]]
kind = "expect"
drops = [
  { reason = "NEIGHBOR_UNRESOLVED", count = 1 },
  { reason = "IPV4_FRAGMENT_FIRST_DENIED", count = 0 },
]
consumes = [
  { reason = "IPV4_FRAGMENT_HELD", count = 0 },
]

# --- 3. Out of order: the same datagram again (ID 257), its last and
# middle fragments a tick before the first. Both are held (consumed as
# IPV4_FRAGMENT_HELD); the first fragment releases them through the
# fragmentation slots in the same tick it is forwarded in.

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 257, df = false, mf = false, fragment-offset = 370, ttl = 64 }, protocol = 17, payload-hex = "effc091623303d4a5764717e8b98a5b2bfccd9e6" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 257, df = false, mf = true, fragment-offset = 185, ttl = 64 }, protocol = 17, payload-hex = "" }

[[step]]
kind = "tick"
at-ms = 30

[[step]]
kind = "expect"
tx = []
consumes = [
  { reason = "IPV4_FRAGMENT_HELD", count = 2 },
]

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 257, df = false, mf = true, fragment-offset = 0, ttl = 64 }, protocol = 17, payload-hex = "" }

[[step]]
kind = "tick"
at-ms = 40

[[step]]
kind = "expect"
consumes = [
  { reason = "IPV4_FRAGMENT_HELD", count = 2 },
]

# --- 4. Inbound: S answers H's mapping (PUBLIC:40001) with a 2000-byte
# datagram as 1480 + 500 data bytes, the last first. Translated to H:5000
# with an inbound generated ID.

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 30583, df = false, mf = false, fragment-offset = 185, ttl = 60 }, protocol = 17, payload-hex = "" }

[[step]]
kind = "tick"
at-ms = 50

[[step]]
kind = "expect"
tx = []
consumes = [
  { reason = "IPV4_FRAGMENT_HELD", count = 3 },
]

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 30583, df = false, mf = true, fragment-offset = 0, ttl = 60 }, protocol = 17, payload-hex = "" }

[[step]]
kind = "tick"
at-ms = 60

[[step]]
kind = "expect"
consumes = [
  { reason = "IPV4_FRAGMENT_HELD", count = 3 },
]

# --- 5. A refused first fragment refuses its datagram: TCP to S:23 is
# denied by rule 10, so the first fragment (a SYN with data) is
# FIREWALL_RULE_DENIED and the later one IPV4_FRAGMENT_FIRST_DENIED.

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 300, df = false, mf = true, fragment-offset = 0, ttl = 64 }, protocol = 6, payload-hex = "" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 300, df = false, mf = false, fragment-offset = 185, ttl = 64 }, protocol = 6, payload-hex = "2326292c2f3235383b3e4144474a4d505356595c5f6265686b6e7174777a7d808386898c8f929598" }

[[step]]
kind = "tick"
at-ms = 70

[[step]]
kind = "expect"
tx = []
drops = [
  { reason = "FIREWALL_RULE_DENIED", count = 1 },
  { reason = "IPV4_FRAGMENT_FIRST_DENIED", count = 1 },
]

# --- 6. RFC 1858 §3.2: a TCP fragment at offset 1 (8 bytes) starts
# inside any TCP header and could rewrite its flags: refused.

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 301, df = false, mf = false, fragment-offset = 1, ttl = 64 }, protocol = 6, payload-hex = "0714212e3b4855626f7c8996a3b0bdca" }

[[step]]
kind = "tick"
at-ms = 80

[[step]]
kind = "expect"
tx = []
drops = [
  { reason = "IPV4_FRAGMENT_TRANSPORT_HEADER_OVERLAP", count = 1 },
]

# --- 7. A fragmented Echo Request (`ping -s 3000`): the first fragment
# creates the ICMP query mapping, the later ones follow it.

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 400, df = false, mf = true, fragment-offset = 0, ttl = 64 }, protocol = 1, payload-hex = "" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 400, df = false, mf = true, fragment-offset = 185, ttl = 64 }, protocol = 1, payload-hex = "" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 400, df = false, mf = false, fragment-offset = 370, ttl = 64 }, protocol = 1, payload-hex = "afb4b9bec3c8cdd2d7dce1e6ebf0f5faff04090e13181d22272c31363b40454a4f54595e63686d72777c81868b90959a" }

[[step]]
kind = "tick"
at-ms = 90

[[step]]
kind = "expect"
consumes = [
  { reason = "IPV4_FRAGMENT_HELD", count = 3 },
]

# --- 8. A later fragment whose first fragment never comes: held at 100 ms,
# expired after the 1000 ms timeout (counted fragment_tracking.held_expired
# when the next fragment arrives at 1100 ms, itself held).

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 500, df = false, mf = true, fragment-offset = 185, ttl = 64 }, protocol = 17, payload-hex = "0714212e3b4855626f7c8996a3b0bdca" }

[[step]]
kind = "tick"
at-ms = 100

[[step]]
kind = "expect"
tx = []
consumes = [
  { reason = "IPV4_FRAGMENT_HELD", count = 4 },
]

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 501, df = false, mf = true, fragment-offset = 185, ttl = 64 }, protocol = 17, payload-hex = "0714212e3b4855626f7c8996a3b0bdca" }

[[step]]
kind = "tick"
at-ms = 1100

[[step]]
kind = "expect"
tx = []
consumes = [
  { reason = "IPV4_FRAGMENT_HELD", count = 5 },
]
