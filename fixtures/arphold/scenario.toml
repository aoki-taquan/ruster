# ARP-HOLD scenario (ruster-scenario/v1): datagrams to an unresolved next
# hop are held and sent when it resolves (RFC 1122 §2.3.2.2, RFC 1812
# §3.3.2), driven through the validated config, the publication, and
# run_tick on SimIo.
#
# Hosts as in fixtures/m1: LAN host H 192.168.1.10 (static neighbor), WAN
# gateway G 203.0.113.1 and WAN host Q 203.0.113.60 (both resolved by ARP),
# server S 198.51.100.20 behind G, silent WAN host 203.0.113.50 (never
# answers ARP). Router LAN 192.168.1.1, WAN 203.0.113.2 (the NAT public
# address). H's Echo identifier 40007 and source ports 40005..40009 are in
# the NAT pool and free, so they are preserved and every expected frame is
# deterministic; the builders compute every checksum from scratch.
schema = "ruster-scenario/v1"
seed = 20261103
config = "router.toml"

# --- 1. The first ping of H towards S: the Echo Request is held while G is
# resolved (consumed as ARP_HELD, nothing committed), not dropped.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 11 }, op = "request", id = 40007, seq = 1, payload-ascii = "ping-1" }

[[step]]
kind = "tick"
at-ms = 0

[[step]]
kind = "expect"
generation = 1
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
]
consumes = [{ reason = "ARP_HELD", count = 1 }]

# --- 2. G answers: in the same tick the held request is decided anew
# (route, TTL, firewall, ICMP query NAT) and sent to G's learned MAC, and
# S's reply comes back to H: `ping -c1` succeeds on the first try.
[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "tick"
at-ms = 10

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 12 }, op = "reply", id = 40007, seq = 1, payload-ascii = "ping-1" }

[[step]]
kind = "tick"
at-ms = 20

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 11, ttl = 63 }, op = "request", id = 40007, seq = 1, payload-ascii = "ping-1" } },
  { interface = "lan", frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 12, ttl = 63 }, op = "reply", id = 40007, seq = 1, payload-ascii = "ping-1" } },
]
consumes = [
  { reason = "ARP_CONTROL", count = 1 },
  { reason = "ARP_HELD", count = 1 },
]

# --- 3. Latest datagrams: four to the unresolved Q in one batch; three are
# kept per next hop (the first is replaced), and Q's reply sends the last
# three in their order.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "203.0.113.60", id = 21 }, src-port = 40005, dst-port = 7, payload-ascii = "d-1" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "203.0.113.60", id = 22 }, src-port = 40005, dst-port = 7, payload-ascii = "d-2" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "203.0.113.60", id = 23 }, src-port = 40005, dst-port = 7, payload-ascii = "d-3" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "203.0.113.60", id = 24 }, src-port = 40005, dst-port = 7, payload-ascii = "d-4" }

[[step]]
kind = "tick"
at-ms = 100

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:60", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:60", sender-ip = "203.0.113.60", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "tick"
at-ms = 110

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.60", pad-to-min = true } },
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:60" }, ip = { src = "203.0.113.2", dst = "203.0.113.60", id = 22, ttl = 63 }, src-port = 40005, dst-port = 7, payload-ascii = "d-2" } },
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:60" }, ip = { src = "203.0.113.2", dst = "203.0.113.60", id = 23, ttl = 63 }, src-port = 40005, dst-port = 7, payload-ascii = "d-3" } },
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:60" }, ip = { src = "203.0.113.2", dst = "203.0.113.60", id = 24, ttl = 63 }, src-port = 40005, dst-port = 7, payload-ascii = "d-4" } },
]
consumes = [
  { reason = "ARP_CONTROL", count = 2 },
  { reason = "ARP_HELD", count = 5 },
]

# --- 4. A silent next hop: H's datagram is held; three ARP Requests one
# second apart, then the resolution's ICMPv4 Destination Unreachable (Host,
# code 1) to H quoting the datagram as received, and the hold is freed.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "203.0.113.50", id = 30 }, src-port = 40006, dst-port = 7, payload-ascii = "hello?" }

[[step]]
kind = "tick"
at-ms = 200

[[step]]
kind = "tick"
at-ms = 1200

[[step]]
kind = "tick"
at-ms = 2200

[[step]]
kind = "tick"
at-ms = 3200

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.50", pad-to-min = true } },
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.50", pad-to-min = true } },
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.50", pad-to-min = true } },
  { interface = "lan", frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "192.168.1.1", dst = "192.168.1.10", tos = 192, ttl = 64 }, protocol = 1, payload-hex = "0301fb03 00000000 45000022001e400040113cc8c0a8010acb007132 9c460007000e218e68656c6c6f3f" } },
]
consumes = [{ reason = "ARP_HELD", count = 6 }]

# --- 5. The first TCP SYN to a new next hop (another WAN host, the WAN
# gateway's own address space): held, then sent when the host answers, with
# no retransmission by H.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "203.0.113.70", id = 40 }, src-port = 40008, dst-port = 443, seq = 1000, flags = ["syn"], window = 4096 }

[[step]]
kind = "tick"
at-ms = 4000

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:70", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:70", sender-ip = "203.0.113.70", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "tick"
at-ms = 4010

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.70", pad-to-min = true } },
  { interface = "wan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:70" }, ip = { src = "203.0.113.2", dst = "203.0.113.70", id = 40, ttl = 63 }, src-port = 40008, dst-port = 443, seq = 1000, flags = ["syn"], window = 4096 } },
]
consumes = [{ reason = "ARP_HELD", count = 7 }]

# --- 6. A reload drops what is held (a held datagram would be decided
# under the successor's rules): the silent host's datagram is held, the
# same document is applied as generation 2, and nothing is sent when that
# host later answers.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "203.0.113.50", id = 50 }, src-port = 40009, dst-port = 7, payload-ascii = "late" }

[[step]]
kind = "tick"
at-ms = 7000

[[step]]
kind = "apply"
config = "router.toml"
outcome = "applied"

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:50", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:50", sender-ip = "203.0.113.50", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "tick"
at-ms = 7010

[[step]]
kind = "expect"
generation = 2
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.50", pad-to-min = true } },
]
consumes = [
  { reason = "ARP_CONTROL", count = 4 },
  { reason = "ARP_HELD", count = 8 },
]
