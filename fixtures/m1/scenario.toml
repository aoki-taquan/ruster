# M1 golden scenario (ruster-scenario/v1), driven through the public
# full-service composition (run_tick + ActivePublication) on SimIo.
#
# Hosts: LAN host H 192.168.1.10 (02:..:10, static neighbor), WAN gateway
# G 203.0.113.1 (02:..:fe, resolved by ARP), server S 198.51.100.20 behind G,
# silent WAN host 203.0.113.50 (never answers ARP). Router LAN 02:..:01
# 192.168.1.1, WAN 02:..:02 203.0.113.2 (also the NAT public address).
#
# Expected frames are written with the typed builders, so their IPv4, UDP,
# TCP, and ICMPv4 checksums are computed independently of the router's
# incremental updates. NAT public ports (40011 UDP, 40008 TCP) are the
# deterministic allocator choice for this seed and configuration. ICMPv4
# error payloads were computed separately (RFC 792: type, code, checksum,
# unused, then the received IPv4 header and payload as quoted bytes).
schema = "ruster-scenario/v1"
seed = 20261101
config = "router-v1.toml"

# --- 1. Dynamic ARP: the first packet to S triggers an ARP Request for G.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 1 }, src-port = 5000, dst-port = 53, payload-ascii = "query-1" }

[[step]]
kind = "tick"
at-ms = 0

[[step]]
kind = "expect"
generation = 1
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
]
drops = [{ reason = "NEIGHBOR_UNRESOLVED", count = 1 }]

# --- 2. G replies; the reply is learned and the retransmitted query is routed
# via the static route, source-NATed, and sent to G's learned MAC.
[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 2 }, src-port = 5000, dst-port = 53, payload-ascii = "query-1" }

[[step]]
kind = "tick"
at-ms = 10

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 2, ttl = 63 }, src-port = 40011, dst-port = 53, payload-ascii = "query-1" } },
]
consumes = [{ reason = "ARP_CONTROL", count = 1 }]

# --- 3. UDP NAT: S's answer to the public mapping is de-translated to H.
[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 3 }, src-port = 53, dst-port = 40011, payload-ascii = "answer-1" }

[[step]]
kind = "tick"
at-ms = 20

[[step]]
kind = "expect"
tx = [
  { interface = "lan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 3, ttl = 63 }, src-port = 53, dst-port = 5000, payload-ascii = "answer-1" } },
]

# --- 4. TCP NAT: outbound SYN translated, SYN-ACK de-translated.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 4 }, src-port = 5001, dst-port = 80, seq = 1000, flags = ["syn"], window = 4096 }

[[step]]
kind = "tick"
at-ms = 30

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 5 }, src-port = 80, dst-port = 40008, seq = 9000, ack = 1001, flags = ["syn", "ack"], window = 8192 }

[[step]]
kind = "tick"
at-ms = 40

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 4, ttl = 63 }, src-port = 40008, dst-port = 80, seq = 1000, flags = ["syn"], window = 4096 } },
  { interface = "lan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 5, ttl = 63 }, src-port = 80, dst-port = 5001, seq = 9000, ack = 1001, flags = ["syn", "ack"], window = 8192 } },
]

# --- 5. Firewall rule 10 denies LAN->WAN TCP/23 (silent); unsolicited
# inbound UDP has no NAT mapping (silent); TTL 1 yields ICMPv4 Time Exceeded
# quoting the pre-SNAT packet; a destination without a route is dropped
# silently because the firewall is bound (FIREWALL_ROUTE_UNAVAILABLE, no
# Destination Unreachable in the full composition).
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 6 }, src-port = 5002, dst-port = 23, seq = 7, flags = ["syn"], window = 4096 }

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 7 }, src-port = 53, dst-port = 40001, payload-ascii = "unsolicited" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 8, ttl = 1 }, src-port = 5003, dst-port = 33434, payload-ascii = "trace" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "192.0.2.50", id = 9 }, src-port = 5004, dst-port = 9, payload-ascii = "nowhere" }

[[step]]
kind = "tick"
at-ms = 50

[[step]]
kind = "expect"
tx = [
  { interface = "lan", frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "192.168.1.1", dst = "192.168.1.10", tos = 192, ttl = 64 }, protocol = 1, payload-hex = "0b00e118 00000000 450000210008400001118dcac0a8010ac6336414 138b829a000d42de 7472616365" } },
]
drops = [
  { reason = "FIREWALL_RULE_DENIED", count = 1 },
  { reason = "NAT44_UDP_MAPPING_MISS", count = 1 },
  { reason = "IPV4_TTL_EXPIRED", count = 1 },
  { reason = "FIREWALL_ROUTE_UNAVAILABLE", count = 1 },
]

# --- 6. Host unreachable: a directly connected WAN host never answers. Three
# ARP Requests one second apart, then ICMPv4 Destination Unreachable
# (Host, code 1) to H once the resolution times out.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "203.0.113.50", id = 10 }, src-port = 5005, dst-port = 7, payload-ascii = "hello?" }

[[step]]
kind = "tick"
at-ms = 200

[[step]]
kind = "tick"
at-ms = 1200

[[step]]
kind = "tick"
at-ms = 2200

[[step]]
kind = "tick"
at-ms = 3200

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.50", pad-to-min = true } },
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.50", pad-to-min = true } },
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.50", pad-to-min = true } },
  { interface = "lan", frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "192.168.1.1", dst = "192.168.1.10", tos = 192, ttl = 64 }, protocol = 1, payload-hex = "0301fb03 00000000 45000022000a400040113cdcc0a8010acb007132 138d0007000eaa47 68656c6c6f3f" } },
]
drops = [{ reason = "NEIGHBOR_UNRESOLVED", count = 2 }]

# --- 7. Reload v2 at a generation boundary. Every reload flushes ARP
# learning and all NAT/firewall state (flush counts are in the apply event).
[[step]]
kind = "tick"
at-ms = 3300

[[step]]
kind = "apply"
config = "router-v2.toml"
outcome = "applied"

[[step]]
kind = "expect"
generation = 2
tx = []

# The flushed UDP mapping no longer admits S's late answer, and the new
# 192.0.2.0/24 route needs the flushed gateway to be resolved again.
[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 11 }, src-port = 53, dst-port = 40011, payload-ascii = "answer-2" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "192.0.2.50", id = 12 }, src-port = 5004, dst-port = 9, payload-ascii = "nowhere" }

[[step]]
kind = "tick"
at-ms = 4000

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "192.0.2.50", id = 13 }, src-port = 5004, dst-port = 9, payload-ascii = "nowhere" }

[[step]]
kind = "tick"
at-ms = 4010

[[step]]
kind = "expect"
generation = 2
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "192.0.2.50", id = 13, ttl = 63 }, src-port = 40011, dst-port = 9, payload-ascii = "nowhere" } },
]
drops = [
  { reason = "NAT44_UDP_MAPPING_MISS", count = 2 },
  { reason = "NEIGHBOR_UNRESOLVED", count = 3 },
]
consumes = [{ reason = "ARP_CONTROL", count = 2 }]

# --- 8. Rejected applies leave generation 2 and its state working: an
# invalid document (validation), a capacity change, and an interface change
# (both restart-required). The sequencer still consumes generations 3 and 4
# for the two candidates it built.
[[step]]
kind = "apply"
config = "router-invalid.toml"
outcome = "rejected"
reason = "invalid"

[[step]]
kind = "apply"
config = "router-capacity.toml"
outcome = "rejected"
reason = "restart-required"

[[step]]
kind = "apply"
config = "router-interface.toml"
outcome = "rejected"
reason = "restart-required"

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "192.0.2.50", id = 14 }, src-port = 5004, dst-port = 9, payload-ascii = "nowhere" }

[[step]]
kind = "tick"
at-ms = 4020

[[step]]
kind = "expect"
generation = 2
tx = [
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "192.0.2.50", id = 14, ttl = 63 }, src-port = 40011, dst-port = 9, payload-ascii = "nowhere" } },
]

# --- 9. Rollback: re-applying v1 is a new generation (5) with fresh keys;
# the v2-only route is gone again.
[[step]]
kind = "apply"
config = "router-v1.toml"
outcome = "applied"

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "192.0.2.50", id = 15 }, src-port = 5004, dst-port = 9, payload-ascii = "nowhere" }

[[step]]
kind = "tick"
at-ms = 4030

[[step]]
kind = "expect"
generation = 5
tx = []
drops = [
  { reason = "FIREWALL_ROUTE_UNAVAILABLE", count = 2 },
  { reason = "FIREWALL_RULE_DENIED", count = 1 },
  { reason = "IPV4_TTL_EXPIRED", count = 1 },
  { reason = "NAT44_UDP_MAPPING_MISS", count = 2 },
  { reason = "NEIGHBOR_UNRESOLVED", count = 3 },
]
consumes = [{ reason = "ARP_CONTROL", count = 2 }]
