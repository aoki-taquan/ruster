# Maximal production config (H3): every runtime table at its production
# limit (`PRODUCTION_VALIDATION_LIMITS`): the quote tables (resolution
# failure holds, ICMPv4 error actions, TCP NAT unsolicited-SYN holds) at
# 4096, every other table at 65536, and the NAT44 port pool at its widest
# (1..=65535). Runtime storage is 61042880 bytes (58.22 MiB). One slot more in any table is refused by
# `ruster run` and by `validate`/`plan` of this af-xdp document; the
# simulator's limits (a sim backend) allow the quote tables up to 65536. Devices
# `rusternodev0/1` do not exist: tests rewrite them before any live use.
# Based on fixtures/m1/router-v1.toml.
schema-version = 1

[[interfaces]]
id = 1
name = "lan"
device = "rusternodev0"
mac = "02:00:00:00:00:01"

[[interfaces]]
id = 2
name = "wan"
device = "rusternodev1"
mac = "02:00:00:00:00:02"

[[addresses]]
interface = "lan"
ipv4 = "192.168.1.1/24"

[[addresses]]
interface = "wan"
ipv4 = "203.0.113.2/24"

[[routes]]
prefix = "198.51.100.0/24"
egress = "wan"
via = "203.0.113.1"

[[neighbors]]
interface = "lan"
address = "192.168.1.10"
mac = "02:00:00:00:00:10"

[ipv4-origin]
default-ttl = 64
# RFC 1812 §4.3.3.6 option; `false` silently drops Echo Requests to router
# addresses (ICMPV4_ECHO_DISABLED). Reloadable. Default true.
echo-reply = true

[resolution.policy]
interval-ms = 1000
state-ttl-ms = 3000
dynamic-neighbor-ttl-ms = 60000
max-attempts = 3

[resolution.capacity]
states = 65536
actions = 65536
dynamic-neighbors = 65536
failure-holds = 4096

[icmpv4-errors.policy]
interval-ms = 100
state-ttl-ms = 60000

[icmpv4-errors.capacity]
states = 65536
actions = 4096

# Per-kind generation switches (RFC 1812 §1.1.3 options whose default is the
# RFC behavior). `false` drops the class silently and counts it as
# icmpv4_errors.disabled_*. Part of the restart-required ICMPv4 error policy.
# Every key and the table itself are optional and default to true.
[icmpv4-errors.generate]
time-exceeded = true
net-unreachable = true
host-unreachable = true

[nat44.realm]
inside = "lan"
outside = "wan"
public-address = "203.0.113.2"

[nat44.realm.ports]
first = 1
last = 65535

[nat44.udp]
idle-ttl-ms = 300000
allocator-seed = "1"
icmpv4-errors = "disabled"
# RFC 4787 REQ-8 "more stringent" RECOMMENDED default; spelled out here.
# router-v2.toml omits the key, so the v1 -> v2 plan also pins absent == default.
filtering = "address-dependent"

[nat44.udp.capacity]
mappings = 65536
peers = 65536

[nat44.tcp]
idle-ttl-ms = 7440000
allocator-seed = "2"
icmpv4-errors = "disabled"
# RFC 5382 REQ-3 "more stringent" RECOMMENDED default.
filtering = "address-dependent"

[nat44.tcp.capacity]
mappings = 65536
sessions = 65536
unsolicited-syn-holds = 4096

[firewall.policy]
udp-idle-ttl-ms = 300000
tcp-opening-idle-ttl-ms = 240000
tcp-active-idle-ttl-ms = 7440000

[firewall.capacity]
states = 65536

[[firewall.rules]]
id = 10
ingress = "lan"
egress = "wan"
source = "192.168.1.0/24"
destination = "0.0.0.0/0"
protocol = "tcp"
action = "deny"

[firewall.rules.source-ports]
first = 0
last = 65535

[firewall.rules.destination-ports]
first = 23
last = 23

[[firewall.rules]]
id = 20
ingress = "lan"
egress = "wan"
source = "192.168.1.0/24"
destination = "0.0.0.0/0"
protocol = "udp"
action = "allow-stateful"

[firewall.rules.source-ports]
first = 1
last = 65535

[firewall.rules.destination-ports]
first = 1
last = 65535

[[firewall.rules]]
id = 30
ingress = "lan"
egress = "wan"
source = "192.168.1.0/24"
destination = "0.0.0.0/0"
protocol = "tcp"
action = "allow-stateful"

[firewall.rules.source-ports]
first = 1
last = 65535

[firewall.rules.destination-ports]
first = 1
last = 65535

[tick]
rx = 32
# One sweep of the 65536 states takes 512 ticks and one of the 4096 failure
# holds 256, both under the 1000-tick RESOLUTION_SWEEP_SLOW threshold
# (about 1 s at the 1 ms idle backoff of `ruster run`).
resolution-timer-scans = 128
failure-dispatch-scans = 16
generated-arp = 8
generated-icmpv4 = 8

# MTU2 part B: the most fragmentation slots, each a 12-byte slot record
# and 14 + 3826 bytes (the longest datagram an AF_XDP frame can carry,
# more than the default 1500-byte MTU of the interfaces).
[fragmentation]
datagrams = 1024

# NAT-FRAG: the most fragment association entries (each an entry and a host
# slot plus a bucket and a node in each of two directories) and held
# fragments (each a record and a fragmentation slot's 3840 bytes).
[fragment-tracking]
entries = 16384
held-fragments = 512

[backend]
kind = "af-xdp"

[[backend.ports]]
interface = "lan"
queue = 0
mode = "copy"
xdp-attach = "generic"
rings = { fill = 64, rx = 64, tx = 64, completion = 64 }
frame-size = 2048
frame-count = 256
generated-frames = 64

[[backend.ports]]
interface = "wan"
queue = 0
mode = "copy"
xdp-attach = "generic"
rings = { fill = 64, rx = 64, tx = 64, completion = 64 }
frame-size = 2048
frame-count = 256
generated-frames = 64
