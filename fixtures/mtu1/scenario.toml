# MTU1 scenario (ruster-scenario/v1): the egress MTU rule of RFC 1812
# §4.2.2.7 and Fragmentation Needed (RFC 1812 §5.2.7.1, RFC 1191 §4) driven
# through the validated config (`mtu`, `fragmentation-needed`), the
# publication, and run_tick on SimIo.
#
# Hosts as in fixtures/n5: LAN host H 192.168.1.10, WAN gateway G
# 203.0.113.1 (resolved by ARP), server S 198.51.100.20 behind G; router
# LAN 192.168.1.1 (MTU 120), WAN and NAT public address 203.0.113.2 (MTU
# 100). Every ICMP payload below (type 3, code 4, Next-Hop MTU, the quote cut
# to the MTU of the interface the error leaves, checksum) was computed
# separately from the RFCs, not from router output.
schema = "ruster-scenario/v1"
seed = 20261103
config = "router.toml"

# --- 1. Resolve G.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 1 }, src-port = 5000, dst-port = 53, payload-ascii = "query-1" }

[[step]]
kind = "tick"
at-ms = 0

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "tick"
at-ms = 10

[[step]]
kind = "expect"
generation = 1
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
]

# --- 2. A DF datagram of exactly the WAN MTU (100 bytes) is translated and
# forwarded.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 20 }, src-port = 5000, dst-port = 53, payload-hex = "0e151c232a31383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8ff" }

[[step]]
kind = "tick"
at-ms = 20

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 20, ttl = 63 }, src-port = 40001, dst-port = 53, payload-hex = "0e151c232a31383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8ff" } },
]

# --- 3. One byte more (101, DF): discarded, and Fragmentation Needed with
# Next-Hop MTU 100 goes back to H from the LAN address, quoting H's datagram
# as sent (before NAT), cut to 92 bytes so the error fits the LAN MTU (120).
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 21 }, src-port = 5000, dst-port = 53, payload-hex = "151c232a31383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8ff060d" }

[[step]]
kind = "tick"
at-ms = 30

[[step]]
kind = "expect"
tx = [
  { interface = "lan", frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "192.168.1.1", dst = "192.168.1.10", tos = 192, ttl = 64 }, protocol = 1, payload-hex = "0304a0bc00000064450000650015400040114e79c0a8010ac6336414138800350051781e151c232a31383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ce" } },
]
drops = [
  { reason = "NEIGHBOR_UNRESOLVED", count = 1 },
  { reason = "IPV4_FRAGMENTATION_NEEDED", count = 1 },
]

# --- 4. The same 10 ms later is discarded but rate limited (100 ms per
# egress). Without DF the NAT refuses the datagram before any MTU check
# (it translates only atomic datagrams); a DF-clear datagram routed
# without NAT would be IPV4_FRAGMENTATION_REQUIRED (NAT44-019L).
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 22 }, src-port = 5000, dst-port = 53, payload-hex = "1c232a31383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8ff060d14" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 23, df = false }, src-port = 5000, dst-port = 53, payload-hex = "232a31383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8ff060d141b" }

[[step]]
kind = "tick"
at-ms = 40

[[step]]
kind = "expect"
tx = []
drops = [
  { reason = "IPV4_FRAGMENTATION_NEEDED", count = 2 },
  { reason = "NAT44_UDP_NON_ATOMIC_IPV4_UNSUPPORTED", count = 1 },
]

# --- 5. Inbound: S's 121-byte DF answer to the public mapping exceeds the
# LAN MTU (120). Fragmentation Needed with Next-Hop MTU 120 goes to S from
# the WAN address via G, quoting the datagram S sent (to the public
# address), cut to 72 bytes for the WAN MTU (100). Then an answer of
# exactly 120 bytes is de-translated to H.
[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 31 }, src-port = 53, dst-port = 40001, payload-hex = "2a31383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8ff060d141b222930373e454c535a61686f767d848b9299a0a7ae" }

[[step]]
kind = "tick"
at-ms = 50

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 32 }, src-port = 53, dst-port = 40001, payload-hex = "31383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8ff060d141b222930373e454c535a61686f767d848b9299a0a7ae" }

[[step]]
kind = "tick"
at-ms = 60

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", tos = 192, ttl = 64 }, protocol = 1, payload-hex = "030405e20000007845000079001f40004011d40ac6336414cb00710200359c41006511e42a31383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b42495057" } },
  { interface = "lan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 32, ttl = 63 }, src-port = 53, dst-port = 5000, payload-hex = "31383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8ff060d141b222930373e454c535a61686f767d848b9299a0a7ae" } },
]
drops = [{ reason = "IPV4_FRAGMENTATION_NEEDED", count = 3 }]

# --- 6. H pings the LAN address with a 121-byte request: the reply would
# exceed the LAN MTU and is not sent (the router does not fragment).
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "192.168.1.1", id = 33 }, op = "request", id = 7, seq = 1, payload-hex = "383f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8ff060d141b222930373e454c535a61686f767d848b9299a0a7aeb5bc" }

[[step]]
kind = "tick"
at-ms = 70

[[step]]
kind = "expect"
tx = []
drops = [{ reason = "ICMPV4_ECHO_REPLY_EXCEEDS_MTU", count = 1 }]

# --- 7. `ping -M do -s 73` from H to S through the ICMP query NAT: the
# 101-byte Echo Request is answered with Fragmentation Needed (MTU 100)
# quoting the untranslated request; no query mapping is created.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 41 }, op = "request", id = 40007, seq = 1, payload-hex = "3f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8ff060d141b22293037" }

[[step]]
kind = "tick"
at-ms = 200

[[step]]
kind = "expect"
tx = [
  { interface = "lan", frame = { kind = "ipv4", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "192.168.1.1", dst = "192.168.1.10", tos = 192, ttl = 64 }, protocol = 1, payload-hex = "0304840500000064450000650029400040014e75c0a8010ac63364140800c2589c4700013f464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3eaf1f8" } },
]
drops = [{ reason = "IPV4_FRAGMENTATION_NEEDED", count = 4 }]

# --- 8. A datagram the firewall denies (rule 10, LAN->WAN TCP/23) is
# dropped by the firewall first: no error, so the MTU check never answers
# for traffic the policy refuses.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 42 }, src-port = 5002, dst-port = 23, seq = 7, flags = ["syn"], window = 4096, payload-hex = "464d545b626970777e858c939aa1a8afb6bdc4cbd2d9e0e7eef5fc030a11181f262d343b424950575e656c737a81888f969da4abb2b9c0c7ced5dce3ea" }

[[step]]
kind = "tick"
at-ms = 400

[[step]]
kind = "expect"
tx = []
drops = [
  { reason = "FIREWALL_RULE_DENIED", count = 1 },
  { reason = "IPV4_FRAGMENTATION_NEEDED", count = 4 },
]
