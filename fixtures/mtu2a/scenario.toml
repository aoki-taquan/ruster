# MTU2 part A scenario (ruster-scenario/v1): NAT44 admits whole DF-clear
# datagrams (MF=0, offset 0) of UDP, TCP and ICMP queries, outbound and
# inbound, through the validated config, the publication, and run_tick on
# SimIo, and gives each a generated IPv4 ID (RFC 6864 §5.3.1, NAT44-126).
#
# Hosts as in fixtures/mtu1: LAN host H 192.168.1.10, WAN gateway G
# 203.0.113.1 (resolved by ARP), server S 198.51.100.20 behind G; router
# LAN 192.168.1.1, WAN and NAT public address 203.0.113.2, both MTU 1500.
#
# The generated IDs come from the keyed per-tuple counters of the runtime
# (key from the scenario seed), so their values were read from the run;
# crates/sim-scenario/tests/df_clear.rs checks the properties: consecutive
# per translated (source, destination, protocol) tuple, and atomic (DF)
# datagrams keep the ID the host sent. Everything else in each expected
# frame (addresses, ports, TTL, checksums) is built by the scenario builder.
schema = "ruster-scenario/v1"
seed = 20261104
config = "router.toml"

# --- 1. Resolve G (H's first datagram, with DF, waits for ARP).
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 1 }, src-port = 5000, dst-port = 53, payload-ascii = "query-1" }

[[step]]
kind = "tick"
at-ms = 0

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "tick"
at-ms = 10

[[step]]
kind = "expect"
generation = 1
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
]

# --- 2. Outbound UDP: two DF-clear datagrams with the same host ID 100 get
# consecutive IDs of (203.0.113.2, 198.51.100.20, UDP); a DF datagram keeps
# its ID 102.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 100, df = false }, src-port = 5000, dst-port = 53, payload-ascii = "windows-1" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 100, df = false }, src-port = 5000, dst-port = 53, payload-ascii = "windows-2" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 102 }, src-port = 5000, dst-port = 53, payload-ascii = "linux-3" }

[[step]]
kind = "tick"
at-ms = 20

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 25808, df = false, ttl = 63 }, src-port = 40000, dst-port = 53, payload-ascii = "windows-1" } },
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 25809, df = false, ttl = 63 }, src-port = 40000, dst-port = 53, payload-ascii = "windows-2" } },
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 102, ttl = 63 }, src-port = 40000, dst-port = 53, payload-ascii = "linux-3" } },
]

# --- 3. Inbound UDP: S's DF-clear answer reaches H with an ID of
# (198.51.100.20, 192.168.1.10, UDP).
[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 200, df = false }, src-port = 53, dst-port = 40000, payload-ascii = "answer-1" }

[[step]]
kind = "tick"
at-ms = 30

[[step]]
kind = "expect"
tx = [
  { interface = "lan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 15484, df = false, ttl = 63 }, src-port = 53, dst-port = 5000, payload-ascii = "answer-1" } },
]

# --- 4. TCP: a DF-clear SYN out and the DF-clear SYN-ACK back.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 300, df = false }, src-port = 5001, dst-port = 80, seq = 1000, flags = ["syn"], window = 4096 }

[[step]]
kind = "tick"
at-ms = 40

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 400, df = false }, src-port = 80, dst-port = 40009, seq = 5000, ack = 1001, flags = ["syn", "ack"], window = 4096 }

[[step]]
kind = "tick"
at-ms = 50

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 23982, df = false, ttl = 63 }, src-port = 40009, dst-port = 80, seq = 1000, flags = ["syn"], window = 4096 } },
  { interface = "lan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 6677, df = false, ttl = 63 }, src-port = 80, dst-port = 5001, seq = 5000, ack = 1001, flags = ["syn", "ack"], window = 4096 } },
]

# --- 5. ICMP: a DF-clear Echo Request (Windows ping) out, the DF-clear
# Echo Reply (Linux) back.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 500, df = false }, op = "request", id = 40007, seq = 1, payload-ascii = "ping-1" }

[[step]]
kind = "tick"
at-ms = 60

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 600, df = false }, op = "reply", id = 40007, seq = 1, payload-ascii = "ping-1" }

[[step]]
kind = "tick"
at-ms = 70

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 46136, df = false, ttl = 63 }, op = "request", id = 40007, seq = 1, payload-ascii = "ping-1" } },
  { interface = "lan", frame = { kind = "icmp-echo", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 36674, df = false, ttl = 63 }, op = "reply", id = 40007, seq = 1, payload-ascii = "ping-1" } },
]

# --- 6. A fragment (MF) stays refused, before any state: the firewall
# validates first (FIREWALL_FRAGMENT_UNSUPPORTED); without the firewall it
# would be NAT44_UDP_NON_ATOMIC_IPV4_UNSUPPORTED (NAT-FRAG, deferred).
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.21", id = 700, df = false, mf = true }, src-port = 5003, dst-port = 53, payload-ascii = "fragment" }

[[step]]
kind = "tick"
at-ms = 80

[[step]]
kind = "expect"
tx = []
drops = [
  { reason = "FIREWALL_FRAGMENT_UNSUPPORTED", count = 1 },
]
