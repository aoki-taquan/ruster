# RELOAD-CARRY scenario (ruster-scenario/v1): established NAT44 flows
# survive a reload that changes the firewall rules without affecting them,
# and a later reload whose rules deny one of them revokes exactly that one.
#
# Hosts as in the M1 golden scenario: LAN host H 192.168.1.10 (static
# neighbor), WAN gateway G 203.0.113.1 (learned by ARP), server S
# 198.51.100.20 behind G. Public ports are the keyed allocator choice for the
# generation-1 key of this seed (40014 for H:5000 UDP, 40006 for H:5001 TCP);
# a carry keeps that key, so no port changes after a reload.
schema = "ruster-scenario/v1"
seed = 20261101
config = "router.toml"

# --- 1. G is learned by ARP; H's DNS query is translated.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 1 }, src-port = 5000, dst-port = 53, payload-ascii = "query-1" }

[[step]]
kind = "tick"
at-ms = 0

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "arp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, op = "reply", sender-mac = "02:00:00:00:00:fe", sender-ip = "203.0.113.1", target-mac = "02:00:00:00:00:02", target-ip = "203.0.113.2", pad-to-min = true }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 2 }, src-port = 5000, dst-port = 53, payload-ascii = "query-1" }

[[step]]
kind = "tick"
at-ms = 10

[[step]]
kind = "expect"
generation = 1
tx = [
  { interface = "wan", frame = { kind = "arp", eth = { src = "02:00:00:00:00:02", dst = "ff:ff:ff:ff:ff:ff" }, op = "request", sender-mac = "02:00:00:00:00:02", sender-ip = "203.0.113.2", target-ip = "203.0.113.1", pad-to-min = true } },
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 2, ttl = 63 }, src-port = 40014, dst-port = 53, payload-ascii = "query-1" } },
]
drops = [{ reason = "NEIGHBOR_UNRESOLVED", count = 1 }]
consumes = [{ reason = "ARP_CONTROL", count = 1 }]

# --- 2. A TCP connection H:5001 -> S:80 completes its handshake.
[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 3 }, src-port = 5001, dst-port = 80, seq = 1000, flags = ["syn"], window = 4096 }

[[step]]
kind = "tick"
at-ms = 20

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 4 }, src-port = 80, dst-port = 40006, seq = 9000, ack = 1001, flags = ["syn", "ack"], window = 8192 }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 5 }, src-port = 5001, dst-port = 80, seq = 1001, ack = 9001, flags = ["ack"], window = 4096 }

[[step]]
kind = "tick"
at-ms = 30

[[step]]
kind = "expect"
tx = [
  { interface = "wan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 3, ttl = 63 }, src-port = 40006, dst-port = 80, seq = 1000, flags = ["syn"], window = 4096 } },
  { interface = "lan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 4, ttl = 63 }, src-port = 80, dst-port = 5001, seq = 9000, ack = 1001, flags = ["syn", "ack"], window = 8192 } },
  { interface = "wan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 5, ttl = 63 }, src-port = 40006, dst-port = 80, seq = 1001, ack = 9001, flags = ["ack"], window = 4096 } },
]

# --- 3. Reload a document that adds an unrelated deny rule (TCP/25). The
# apply event shows every family "carried": both flows pass the changed
# rules, so none is revoked, and the gateway stays learned.
[[step]]
kind = "apply"
config = "router-rule.toml"
outcome = "applied"

[[step]]
kind = "expect"
generation = 2
tx = []

# S's DNS answer and its next TCP segment reach H through the carried
# mappings and flows, and H's next query leaves at once (no new ARP) from the
# same public port.
[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 6 }, src-port = 53, dst-port = 40014, payload-ascii = "answer-1" }

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 7 }, src-port = 80, dst-port = 40006, seq = 9001, ack = 1001, flags = ["ack"], window = 8192 }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 8 }, src-port = 5000, dst-port = 53, payload-ascii = "query-2" }

[[step]]
kind = "tick"
at-ms = 40

[[step]]
kind = "expect"
generation = 2
tx = [
  { interface = "lan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 6, ttl = 63 }, src-port = 53, dst-port = 5000, payload-ascii = "answer-1" } },
  { interface = "lan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 7, ttl = 63 }, src-port = 80, dst-port = 5001, seq = 9001, ack = 1001, flags = ["ack"], window = 8192 } },
  { interface = "wan", frame = { kind = "udp", eth = { src = "02:00:00:00:00:02", dst = "02:00:00:00:00:fe" }, ip = { src = "203.0.113.2", dst = "198.51.100.20", id = 8, ttl = 63 }, src-port = 40014, dst-port = 53, payload-ascii = "query-2" } },
]
drops = [{ reason = "NEIGHBOR_UNRESOLVED", count = 1 }]

# --- 4. Reload a document that denies LAN->WAN UDP/53 ahead of the UDP
# allow. The carry re-evaluates both flows: the DNS flow is revoked
# (firewall_flows_revoked = 1), the TCP flow is kept. The UDP mapping itself
# is carried, but the firewall now drops S's next answer (an inbound packet
# without a live flow) and H's next query (rule 16); the TCP flow continues.
[[step]]
kind = "apply"
config = "router-deny.toml"
outcome = "applied"

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 9 }, src-port = 53, dst-port = 40014, payload-ascii = "answer-2" }

[[step]]
kind = "inject"
interface = "lan"
frame = { kind = "udp", eth = { src = "02:00:00:00:00:10", dst = "02:00:00:00:00:01" }, ip = { src = "192.168.1.10", dst = "198.51.100.20", id = 10 }, src-port = 5000, dst-port = 53, payload-ascii = "query-3" }

[[step]]
kind = "inject"
interface = "wan"
frame = { kind = "tcp", eth = { src = "02:00:00:00:00:fe", dst = "02:00:00:00:00:02" }, ip = { src = "198.51.100.20", dst = "203.0.113.2", id = 11 }, src-port = 80, dst-port = 40006, seq = 9001, ack = 1001, flags = ["ack"], window = 8192 }

[[step]]
kind = "tick"
at-ms = 50

[[step]]
kind = "expect"
generation = 3
tx = [
  { interface = "lan", frame = { kind = "tcp", eth = { src = "02:00:00:00:00:01", dst = "02:00:00:00:00:10" }, ip = { src = "198.51.100.20", dst = "192.168.1.10", id = 11, ttl = 63 }, src-port = 80, dst-port = 5001, seq = 9001, ack = 1001, flags = ["ack"], window = 8192 } },
]
drops = [
  { reason = "FIREWALL_DEFAULT_DENIED", count = 1 },
  { reason = "FIREWALL_RULE_DENIED", count = 1 },
  { reason = "NEIGHBOR_UNRESOLVED", count = 1 },
]
