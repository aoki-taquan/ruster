name: Bug Report
description: バグ報告
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: バグの概要
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: 期待される動作
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: 再現手順
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "OS, Rust version, DPDK version 等"
      placeholder: |
        - OS: Ubuntu 24.04
        - Rust: 1.XX.X
        - DPDK: XX.XX
    validations:
      required: false
