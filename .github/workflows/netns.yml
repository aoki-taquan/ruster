name: AF_PACKET netns E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  netns:
    name: AF_PACKET netns E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Check netns prerequisites
        run: |
          set -euo pipefail
          command -v ip
          ip -V
          command -v cargo
          test "$(sudo -n id -u)" -eq 0
          sudo -n ip netns list
      - name: Snapshot network state before netns E2E
        shell: bash
        run: |
          set -euo pipefail
          sudo -n ip -o link show type veth \
            | awk -F': ' '{split($2, fields, " "); sub(/@.*/, "", fields[1]); print fields[1]}' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/ruster-netns-e2e-veths.snapshot"
          sudo -n ip netns list \
            | awk '{print $1}' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/ruster-netns-e2e-netns.snapshot"
      - name: Run privileged AF_PACKET netns E2E
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            ./scripts/run-netns-e2e.sh
      - name: Verify AF_PACKET netns E2E cleanup
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n ip -o link show type veth \
            | awk -F': ' '{split($2, fields, " "); sub(/@.*/, "", fields[1]); print fields[1]}' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/ruster-netns-e2e-veths.current"
          sudo -n ip netns list \
            | awk '{print $1}' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/ruster-netns-e2e-netns.current"
          status=0
          if ! diff -u \
            "$RUNNER_TEMP/ruster-netns-e2e-veths.snapshot" \
            "$RUNNER_TEMP/ruster-netns-e2e-veths.current"; then
            echo 'veth state changed after AF_PACKET netns E2E' >&2
            status=1
          fi
          if ! diff -u \
            "$RUNNER_TEMP/ruster-netns-e2e-netns.snapshot" \
            "$RUNNER_TEMP/ruster-netns-e2e-netns.current"; then
            echo 'netns state changed after AF_PACKET netns E2E' >&2
            status=1
          fi
          exit "$status"
      - name: Run privileged route netns E2E
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            ./scripts/run-netns-route-e2e.sh
      - name: Verify route netns E2E cleanup
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n ip -o link show type veth \
            | awk -F': ' '{split($2, fields, " "); sub(/@.*/, "", fields[1]); print fields[1]}' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/ruster-netns-e2e-veths.current"
          sudo -n ip netns list \
            | awk '{print $1}' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/ruster-netns-e2e-netns.current"
          status=0
          if ! diff -u \
            "$RUNNER_TEMP/ruster-netns-e2e-veths.snapshot" \
            "$RUNNER_TEMP/ruster-netns-e2e-veths.current"; then
            echo 'veth state changed after route netns E2E' >&2
            status=1
          fi
          if ! diff -u \
            "$RUNNER_TEMP/ruster-netns-e2e-netns.snapshot" \
            "$RUNNER_TEMP/ruster-netns-e2e-netns.current"; then
            echo 'netns state changed after route netns E2E' >&2
            status=1
          fi
          exit "$status"
      - name: Check XDP prerequisites
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          command -v bpftool
          xdp_features="$(sudo -n bpftool feature probe kernel)"
          printf '%s\n' "$xdp_features"
          grep -Fqx 'bpf() syscall is available' <<<"$xdp_features"
          grep -Fqx 'eBPF program_type xdp is available' <<<"$xdp_features"
      - name: Run privileged XDP netns E2E
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            ./scripts/run-netns-xdp-e2e.sh
      - name: Verify XDP netns E2E cleanup
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n ip -o link show type veth \
            | awk -F': ' '{split($2, fields, " "); sub(/@.*/, "", fields[1]); print fields[1]}' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/ruster-netns-e2e-veths.current"
          sudo -n ip netns list \
            | awk '{print $1}' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/ruster-netns-e2e-netns.current"
          status=0
          if ! diff -u \
            "$RUNNER_TEMP/ruster-netns-e2e-veths.snapshot" \
            "$RUNNER_TEMP/ruster-netns-e2e-veths.current"; then
            echo 'veth state changed after XDP netns E2E' >&2
            status=1
          fi
          if ! diff -u \
            "$RUNNER_TEMP/ruster-netns-e2e-netns.snapshot" \
            "$RUNNER_TEMP/ruster-netns-e2e-netns.current"; then
            echo 'netns state changed after XDP netns E2E' >&2
            status=1
          fi
          exit "$status"
      - name: Run privileged ruster AF_XDP daemon netns E2E
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            ./scripts/run-netns-xdp-run-e2e.sh
      - name: Verify ruster AF_XDP daemon netns E2E cleanup
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n ip -o link show type veth \
            | awk -F': ' '{split($2, fields, " "); sub(/@.*/, "", fields[1]); print fields[1]}' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/ruster-netns-e2e-veths.current"
          sudo -n ip netns list \
            | awk '{print $1}' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/ruster-netns-e2e-netns.current"
          status=0
          if ! diff -u \
            "$RUNNER_TEMP/ruster-netns-e2e-veths.snapshot" \
            "$RUNNER_TEMP/ruster-netns-e2e-veths.current"; then
            echo 'veth state changed after ruster AF_XDP daemon netns E2E' >&2
            status=1
          fi
          if ! diff -u \
            "$RUNNER_TEMP/ruster-netns-e2e-netns.snapshot" \
            "$RUNNER_TEMP/ruster-netns-e2e-netns.current"; then
            echo 'netns state changed after ruster AF_XDP daemon netns E2E' >&2
            status=1
          fi
          exit "$status"
