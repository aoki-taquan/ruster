name: Runner Health Check

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  health-check:
    name: Self-hosted Runner Health
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 5

    steps:
      - name: Check Docker
        run: |
          echo "=== Docker version ==="
          docker version
          echo ""
          echo "=== Docker info ==="
          docker info --format '{{.ServerVersion}} / {{.OSType}} / {{.Architecture}}'
          echo ""
          echo "=== Docker disk usage ==="
          docker system df

      - name: Check containerlab
        run: |
          echo "=== containerlab version ==="
          containerlab version

      - name: Check KVM
        run: |
          echo "=== /dev/kvm ==="
          ls -la /dev/kvm
          echo ""
          echo "=== KVM modules ==="
          lsmod | grep kvm || echo "WARNING: kvm module not loaded"

      - name: Check disk space
        run: |
          echo "=== Disk usage ==="
          df -h /
          echo ""
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          echo "Available: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 10 ]; then
            echo "WARNING: Less than 10 GB available"
            exit 1
          fi

      - name: Check network connectivity
        run: |
          echo "=== GitHub connectivity ==="
          curl -sI https://github.com | head -5
          echo ""
          echo "=== DNS resolution ==="
          nslookup github.com | head -5

      - name: Smoke test — containerlab deploy/destroy
        run: |
          # Create a minimal topology for smoke test
          TOPO_FILE=$(mktemp /tmp/clab-health-XXXXXX.yml)
          cat > "$TOPO_FILE" <<'TOPOLOGY'
          name: health-check
          topology:
            nodes:
              ping-test:
                kind: linux
                image: debian:bookworm-slim
                exec:
                  - echo "health-check OK"
          TOPOLOGY

          # Remove leading whitespace from heredoc (indented for readability)
          sed -i 's/^          //' "$TOPO_FILE"

          echo "=== Deploy smoke topology ==="
          containerlab deploy --topo "$TOPO_FILE"

          echo "=== Verify container running ==="
          docker ps --filter name=clab-health-check

          echo "=== Destroy smoke topology ==="
          containerlab destroy --topo "$TOPO_FILE" --cleanup

          rm -f "$TOPO_FILE"
          echo "Smoke test passed."
