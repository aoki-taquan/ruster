# Soak Test — Weekly long-running stability test on strict dataplane environment
#
# Deploys a strict containerlab topology (kernel ip_forward=0 on all nodes)
# and runs ruster for an extended duration while monitoring:
#   - Process stability (no crashes)
#   - Memory stability (no unbounded RSS growth)
#   - CPU anomalies
#   - Packet forwarding consistency
#   - Error counter increments
#
# The strict environment ensures all traffic flows through the ruster dataplane,
# providing a true end-to-end stability validation.
#
# Schedule: Every Sunday at 00:00 UTC
# Manual trigger: workflow_dispatch

name: Soak Test (weekly — strict dataplane)

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC
  workflow_dispatch:
    inputs:
      duration_min:
        description: "Soak test duration in minutes"
        required: false
        default: "60"
        type: string
      check_interval:
        description: "Health check interval in seconds"
        required: false
        default: "30"
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  soak-strict:
    name: Soak Test (strict dataplane)
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 120
    env:
      CLAB_TOPO_NAME: ruster-soak-strict-${{ github.run_id }}
      SOAK_DURATION_MIN: ${{ github.event.inputs.duration_min || '60' }}
      SOAK_CHECK_INTERVAL: ${{ github.event.inputs.check_interval || '30' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      # ── Deploy strict containerlab topology ──────────────
      - name: Deploy strict containerlab topology
        run: containerlab deploy --topo tests/containerlab/configs/strict.clab.yml --name "$CLAB_TOPO_NAME"

      - name: Wait for topology to settle
        run: sleep 10

      - name: Run strict setup (harden topology)
        run: CLAB_TOPO_NAME="$CLAB_TOPO_NAME" bash tests/containerlab/scripts/strict-setup.sh

      # ── Validate strict environment before soak ─────────
      - name: Validate strict environment (pre-soak)
        run: |
          echo "=== Pre-soak strict validation ==="
          PREFIX="clab-${CLAB_TOPO_NAME}"

          # Verify all containers are running
          for node in ruster lan-host wan-host; do
            STATE=$(docker inspect --format '{{.State.Status}}' "${PREFIX}-${node}" 2>/dev/null || echo "not_found")
            if [ "$STATE" != "running" ]; then
              echo "ERROR: ${PREFIX}-${node} is not running (state: ${STATE})"
              exit 1
            fi
            echo "  ${node}: running"
          done

          # Verify kernel forwarding is disabled
          for node in ruster lan-host wan-host; do
            FWD=$(docker exec "${PREFIX}-${node}" cat /proc/sys/net/ipv4/ip_forward 2>/dev/null || echo "unknown")
            if [ "$FWD" != "0" ]; then
              echo "ERROR: ${node} has ip_forward=${FWD} (expected 0)"
              exit 1
            fi
            echo "  ${node}: ip_forward=0 (OK)"
          done

          echo "Pre-soak strict validation passed"

      # ── Run soak test ───────────────────────────────────
      - name: Run soak test on strict dataplane
        run: |
          export CLAB_TOPO_NAME="$CLAB_TOPO_NAME"
          export SOAK_DURATION_MIN="$SOAK_DURATION_MIN"
          export SOAK_CHECK_INTERVAL="$SOAK_CHECK_INTERVAL"
          bash tests/soak/soak-run.sh

      # ── Generate report ─────────────────────────────────
      - name: Generate soak report
        if: always()
        run: |
          export CLAB_TOPO_NAME="$CLAB_TOPO_NAME"
          bash tests/soak/soak-report.sh || true

      # ── Write GitHub Step Summary ───────────────────────
      - name: Write step summary
        if: always()
        run: |
          REPORT_DIR="tests/soak/results/latest"
          if [ -f "${REPORT_DIR}/report.md" ]; then
            cat "${REPORT_DIR}/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Soak Test" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No report generated. Check logs for errors." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Upload artifacts ────────────────────────────────
      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-${{ github.run_id }}
          path: tests/soak/results/latest/report.md
          retention-days: 90

      - name: Upload raw metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-metrics-${{ github.run_id }}
          path: tests/soak/results/latest/
          retention-days: 90

      # ── Collect diagnostics on failure ──────────────────
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          export CLAB_TOPO_NAME="$CLAB_TOPO_NAME"
          export STRICT_LOG_DIR="/tmp/${CLAB_TOPO_NAME}-soak-logs"
          bash tests/containerlab/scripts/strict-diagnose.sh || true

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-diagnostics-${{ github.run_id }}
          path: /tmp/${{ env.CLAB_TOPO_NAME }}-soak-logs/
          retention-days: 30

      # ── Cleanup ─────────────────────────────────────────
      - name: Destroy topology
        if: always()
        run: containerlab destroy --name "$CLAB_TOPO_NAME" --cleanup
