name: RFC Deviation Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rfc-check:
    name: RFC-DEVIATION validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint RFC-DEVIATION comments
        run: bash scripts/rfc-deviation-lint.sh

      - name: Verify deviation registry is up to date
        run: |
          bash scripts/rfc-deviation-lint.sh --registry
          if ! git diff --quiet docs/rfc-deviations.tsv 2>/dev/null; then
            echo "ERROR: docs/rfc-deviations.tsv is out of date."
            echo "Run 'make rfc-registry' and commit the updated file."
            git diff docs/rfc-deviations.tsv
            exit 1
          fi
