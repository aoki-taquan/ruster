# E2E Baseline — Required CI gate for v0.1
#
# Validates L2 (ARP, MAC forwarding), L3 (IP routing), NAT, Firewall,
# and SRv6 connectivity using containerlab topology.
# This job MUST pass for PRs to merge.
#
# See docs/ci-gates.md for gate definitions and promotion process.

name: E2E Baseline (L2/L3/NAT/FW/SRv6 — required)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  containerlab-e2e-baseline:
    name: E2E Baseline (L2/L3/NAT/FW/SRv6)
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 30
    env:
      CLAB_TOPO_NAME: ruster-e2e-baseline-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Clean up stale topologies
        run: |
          # Clean up our specific topology name (in case of re-runs)
          containerlab destroy --name "$CLAB_TOPO_NAME" --cleanup 2>/dev/null || true
          # Clean up any leftover ruster-e2e containers from previous runs
          docker ps -a --filter "name=clab-ruster-e2e" --format '{{.ID}}' | xargs -r docker rm -f 2>/dev/null || true
          # Clean up leftover Docker networks from containerlab
          docker network ls --filter "name=clab-ruster-e2e" --format '{{.ID}}' | xargs -r docker network rm 2>/dev/null || true

      - name: Deploy containerlab topology
        run: containerlab deploy --topo tests/containerlab/topology.yml --name "$CLAB_TOPO_NAME"

      - name: Wait for topology to settle
        run: sleep 15

      - name: Verify ruster is running
        run: bash tests/containerlab/scripts/check-ruster.sh

      - name: Run E2E tests (L2/L3/NAT/FW/SRv6)
        run: E2E_SUITES=l2,l3,nat,fw,srv6 bash tests/containerlab/scripts/run-all.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          LOG_DIR="/tmp/${CLAB_TOPO_NAME}-logs"
          mkdir -p "$LOG_DIR"

          echo "=== Container logs ==="
          for node in ruster lan-host wan-host; do
            echo "--- clab-${CLAB_TOPO_NAME}-${node} ---"
            docker logs "clab-${CLAB_TOPO_NAME}-${node}" > "${LOG_DIR}/${node}.log" 2>&1 || true
            docker logs "clab-${CLAB_TOPO_NAME}-${node}" 2>&1 || true
          done

          echo "=== Topology inspect ==="
          containerlab inspect --name "$CLAB_TOPO_NAME" > "${LOG_DIR}/topology-inspect.txt" 2>&1 || true
          containerlab inspect --name "$CLAB_TOPO_NAME" || true

          echo "=== Docker ps ==="
          docker ps -a > "${LOG_DIR}/docker-ps.txt" 2>&1 || true
          docker ps -a

          echo "=== Host interfaces ==="
          ip link show > "${LOG_DIR}/host-interfaces.txt" 2>&1 || true
          ip link show

          echo "=== ruster process & log ==="
          echo "--- ruster process status ---"
          docker exec "clab-${CLAB_TOPO_NAME}-ruster" pgrep -a ruster > "${LOG_DIR}/ruster-pgrep.txt" 2>&1 || echo "ruster not running" | tee "${LOG_DIR}/ruster-pgrep.txt"
          echo "--- ruster application log ---"
          docker exec "clab-${CLAB_TOPO_NAME}-ruster" cat /var/log/ruster.log > "${LOG_DIR}/ruster-app.log" 2>&1 || echo "No ruster log found" | tee "${LOG_DIR}/ruster-app.log"
          docker exec "clab-${CLAB_TOPO_NAME}-ruster" cat /var/log/ruster.log 2>&1 || true

          echo "=== Node network state ==="
          for node in ruster lan-host wan-host; do
            echo "--- ${node} interfaces ---"
            docker exec "clab-${CLAB_TOPO_NAME}-${node}" ip addr show >> "${LOG_DIR}/${node}-debug.log" 2>&1 || true
            echo "--- ${node} routes ---"
            docker exec "clab-${CLAB_TOPO_NAME}-${node}" ip route show >> "${LOG_DIR}/${node}-debug.log" 2>&1 || true
            echo "--- ${node} arp ---"
            docker exec "clab-${CLAB_TOPO_NAME}-${node}" ip neigh show >> "${LOG_DIR}/${node}-debug.log" 2>&1 || true
          done

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-baseline-logs-${{ github.run_id }}
          path: /tmp/${{ env.CLAB_TOPO_NAME }}-logs/
          retention-days: 7

      - name: Destroy topology
        if: always()
        run: containerlab destroy --name "$CLAB_TOPO_NAME" --cleanup
