[workspace]
members = [
  "crates/config",
  "crates/control",
  "crates/dataplane",
  "crates/observe",
  "crates/main",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
