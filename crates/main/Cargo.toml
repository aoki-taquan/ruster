[package]
name = "ruster"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
## Forward the `dpdk` feature to ruster-dataplane so that
## `cargo build -p ruster --features dpdk` enables DPDK I/O.
dpdk = ["ruster-dataplane/dpdk"]

[dependencies]
ruster-config = { path = "../config" }
ruster-control = { path = "../control" }
ruster-dataplane = { path = "../dataplane" }
