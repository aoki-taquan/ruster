[package]
name = "ruster-dataplane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
## Enable DPDK poll-mode driver packet I/O backend.
## Requires DPDK libraries (libdpdk / dpdk-sys) to be installed on the
## build host.  Without this feature, `DpdkPacketIo::new()` returns a
## clear `DpdkError::NotAvailable` error at runtime.
dpdk = []

[dependencies]
ruster-config = { path = "../config" }
ruster-observe = { path = "../observe" }
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "forwarding"
harness = false
