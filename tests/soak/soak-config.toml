# Soak test configuration for strict dataplane environment
#
# This file defines the parameters and thresholds for weekly soak tests
# that run on the strict containerlab topology (kernel ip_forward=0).
#
# All traffic must flow through the ruster dataplane, providing a true
# end-to-end stability validation.

[test]
# Default soak duration in minutes (overridable via SOAK_DURATION_MIN)
duration_min = 60
# Health check interval in seconds (overridable via SOAK_CHECK_INTERVAL)
check_interval_sec = 30
# Traffic generation: parallel ping streams from lan-host to wan-host
traffic_streams = 4
# Ping interval in seconds (per stream)
ping_interval_sec = 0.2
# Settle time after starting/stopping ruster (seconds)
settle_time_sec = 10

[thresholds.memory]
# Maximum RSS growth from baseline measurement (MB)
max_rss_growth_mb = 50
# Maximum absolute RSS at any point during the test (MB)
max_rss_absolute_mb = 256

[thresholds.process]
# Process must remain alive for the entire soak duration
must_be_alive = true
# Maximum average CPU usage over the soak period (percent)
max_cpu_percent = 80

[thresholds.stability]
# Maximum number of process restarts allowed (0 = must not crash)
max_restarts = 0
# Minimum uptime as a fraction of total soak duration (0.0 - 1.0)
min_uptime_fraction = 0.99

[thresholds.packet_loss]
# Maximum allowed packet loss rate (fraction, 0.0 - 1.0)
# 0.01 = 1% loss allowed
max_loss_rate = 0.01

[thresholds.errors]
# Maximum number of error counter increments over the soak period
# Error counters include: rx_errors, tx_errors, rx_dropped, tx_dropped
max_error_increments = 10

[thresholds.latency]
# Maximum average round-trip latency (milliseconds)
# Measured via ping from lan-host to wan-host through ruster
max_avg_rtt_ms = 50
# Maximum p99 round-trip latency (milliseconds)
max_p99_rtt_ms = 200
